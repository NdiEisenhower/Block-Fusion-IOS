<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1800" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <radialGradient id="nebulaPurple" cx="70%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7e22ce" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaBlue" cx="25%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planetGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>

    <filter id="starGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Background Base -->
  <rect width="1000" height="1800" fill="url(#spaceDeep)"/>
  <rect width="1000" height="1800" fill="url(#nebulaPurple)"/>
  <rect width="1000" height="1800" fill="url(#nebulaBlue)"/>

  <!-- Starfield Layer 1 - Tiny Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="50" cy="80" r="1.5"/><circle cx="180" cy="220" r="1.2"/><circle cx="340" cy="120" r="2"/>
    <circle cx="520" cy="90" r="1.5"/><circle cx="750" cy="180" r="2.5"/><circle cx="890" cy="70" r="1.2"/>
    <circle cx="120" cy="450" r="2"/><circle cx="280" cy="580" r="1.5"/><circle cx="450" cy="380" r="1.2"/>
    <circle cx="680" cy="490" r="2"/><circle cx="820" cy="390" r="1.8"/><circle cx="940" cy="520" r="1.5"/>
    <circle cx="80" cy="820" r="1.2"/><circle cx="220" cy="950" r="2.2"/><circle cx="390" cy="880" r="1.5"/>
    <circle cx="610" cy="790" r="1.2"/><circle cx="770" cy="910" r="2"/><circle cx="910" cy="850" r="1.8"/>
    <circle cx="140" cy="1220" r="2"/><circle cx="310" cy="1350" r="1.5"/><circle cx="480" cy="1180" r="2.2"/>
    <circle cx="650" cy="1290" r="1.2"/><circle cx="840" cy="1210" r="1.8"/><circle cx="960" cy="1380" r="1.5"/>
    <circle cx="90" cy="1620" r="1.8"/><circle cx="260" cy="1710" r="1.2"/><circle cx="420" cy="1580" r="2"/>
    <circle cx="590" cy="1690" r="1.5"/><circle cx="790" cy="1620" r="2.2"/><circle cx="920" cy="1740" r="1.2"/>
  </g>

  <!-- Starfield Layer 2 - Bright Twinkling Cross Stars -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.9" filter="url(#starGlow)">
    <!-- Star 1 -->
    <path d="M 750 180 L 750 200 M 740 190 L 760 190" />
    <!-- Star 2 -->
    <path d="M 180 520 L 180 545 M 167 532 L 193 532" />
    <!-- Star 3 -->
    <path d="M 850 920 L 850 940 M 840 930 L 860 930" />
    <!-- Star 4 -->
    <path d="M 220 1420 L 220 1445 M 207 1432 L 233 1432" />
  </g>

  <!-- Large Ringed Planet Top Right -->
  <g transform="translate(780, 320) rotate(-25)">
    <!-- Planet Shadow / Base -->
    <circle cx="0" cy="0" r="90" fill="url(#planetGlow)"/>
    <!-- Planet Rings -->
    <ellipse cx="0" cy="0" rx="170" ry="32" fill="none" stroke="#e0e7ff" stroke-width="14" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="140" ry="24" fill="none" stroke="#c084fc" stroke-width="8" opacity="0.75"/>
  </g>

  <!-- Distant Spiral Galaxy Left Center -->
  <g transform="translate(180, 850) rotate(35) scale(1.2)" opacity="0.45">
    <ellipse cx="0" cy="0" rx="120" ry="40" fill="none" stroke="#38bdf8" stroke-width="18" filter="url(#starGlow)"/>
    <ellipse cx="0" cy="0" rx="80" ry="25" fill="none" stroke="#818cf8" stroke-width="12"/>
    <circle cx="0" cy="0" r="25" fill="#ffffff" filter="url(#starGlow)"/>
  </g>

  <!-- Moon / Planet Crescent Bottom Left -->
  <g transform="translate(140, 1500) rotate(15)">
    <circle cx="0" cy="0" r="70" fill="#38bdf8" opacity="0.8"/>
    <circle cx="25" cy="-15" r="65" fill="#020617"/>
  </g>

  <!-- Shooting Stars / Comets -->
  <g stroke="url(#planetGlow)" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#starGlow)">
    <line x1="200" y1="150" x2="350" y2="280"/>
    <circle cx="350" cy="280" r="3" fill="#ffffff"/>

    <line x1="600" y1="1100" x2="780" y2="1260"/>
    <circle cx="780" cy="1260" r="3" fill="#ffffff"/>
  </g>
</svg>