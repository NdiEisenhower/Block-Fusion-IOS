<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1800" width="100%" height="100%">
  <defs>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0d02"/>
      <stop offset="35%" stop-color="#2d1808"/>
      <stop offset="70%" stop-color="#3d220d"/>
      <stop offset="100%" stop-color="#120701"/>
    </linearGradient>

    <radialGradient id="hearthGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#120701" stop-opacity="0"/>
    </radialGradient>

    <filter id="woodSoftBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Deep Timber Base -->
  <rect width="1000" height="1800" fill="url(#woodBase)"/>
  <rect width="1000" height="1800" fill="url(#hearthGlow)"/>

  <!-- Vertical Wood Planks Lines -->
  <g stroke="#0f0501" stroke-width="8" opacity="0.8">
    <line x1="200" y1="0" x2="200" y2="1800"/>
    <line x1="400" y1="0" x2="400" y2="1800"/>
    <line x1="600" y1="0" x2="600" y2="1800"/>
    <line x1="800" y1="0" x2="800" y2="1800"/>
  </g>

  <!-- Wood Plank Bevel / Highlight Lines -->
  <g stroke="#78350f" stroke-width="2" opacity="0.4">
    <line x1="204" y1="0" x2="204" y2="1800"/>
    <line x1="404" y1="0" x2="404" y2="1800"/>
    <line x1="604" y1="0" x2="604" y2="1800"/>
    <line x1="804" y1="0" x2="804" y2="1800"/>
  </g>

  <!-- Wood Grain Wavy Fibers & Tree Knots -->
  <g fill="none" stroke="#b45309" stroke-width="3" opacity="0.22">
    <!-- Plank 1 Grain -->
    <path d="M 0 50 Q 100 120 200 60 M 0 200 Q 80 150 200 220 M 0 400 Q 120 480 200 420 M 0 800 Q 100 720 200 840 M 0 1200 Q 90 1280 200 1220 M 0 1600 Q 110 1520 200 1640" />

    <!-- Plank 2 Grain & Knot -->
    <path d="M 200 100 Q 300 180 400 120 M 200 350 Q 280 280 400 360 M 200 700 Q 310 780 400 720 M 200 1100 Q 300 1020 400 1140 M 200 1500 Q 290 1580 400 1520" />
    <!-- Knot 1 -->
    <ellipse cx="300" cy="550" rx="35" ry="60" fill="none" stroke-width="4"/>
    <ellipse cx="300" cy="550" rx="18" ry="32" fill="none" stroke-width="3"/>

    <!-- Plank 3 Grain & Knot -->
    <path d="M 400 80 Q 500 140 600 90 M 400 280 Q 490 340 600 300 M 400 600 Q 510 520 600 640 M 400 1000 Q 500 1080 600 1020 M 400 1400 Q 480 1320 600 1440" />
    <!-- Knot 2 -->
    <ellipse cx="500" cy="1220" rx="42" ry="70" fill="none" stroke-width="4"/>
    <ellipse cx="500" cy="1220" rx="20" ry="35" fill="none" stroke-width="3"/>

    <!-- Plank 4 Grain -->
    <path d="M 600 120 Q 700 60 800 140 M 600 420 Q 710 490 800 440 M 600 820 Q 690 750 800 860 M 600 1250 Q 700 1320 800 1260 M 600 1650 Q 710 1580 800 1680" />

    <!-- Plank 5 Grain & Knot -->
    <path d="M 800 150 Q 900 220 1000 160 M 800 480 Q 890 410 1000 500 M 800 900 Q 910 980 1000 920 M 800 1350 Q 900 1280 1000 1380" />
    <!-- Knot 3 -->
    <ellipse cx="900" cy="320" rx="30" ry="50" fill="none" stroke-width="4"/>
  </g>

  <!-- Horizontal Wood Plank Joins -->
  <g stroke="#0a0301" stroke-width="6" opacity="0.9">
    <line x1="0" y1="450" x2="200" y2="450"/>
    <line x1="200" y1="900" x2="400" y2="900"/>
    <line x1="400" y1="350" x2="600" y2="350"/>
    <line x1="400" y1="1350" x2="600" y2="1350"/>
    <line x1="600" y1="750" x2="800" y2="750"/>
    <line x1="800" y1="1100" x2="1000" y2="1100"/>
  </g>

  <!-- Warm Golden Amber Light Vignette -->
  <g fill="#fbbf24" opacity="0.25">
    <circle cx="500" cy="400" r="160" filter="url(#woodSoftBlur)"/>
    <circle cx="300" cy="1100" r="120" filter="url(#woodSoftBlur)"/>
  </g>
</svg>