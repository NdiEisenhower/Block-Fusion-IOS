<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1800" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="35%" stop-color="#065f46"/>
      <stop offset="70%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#021f18"/>
    </linearGradient>

    <radialGradient id="waterLight" cx="50%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#021f18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1800" fill="url(#oceanGrad)"/>
  <rect width="1000" height="1800" fill="url(#waterLight)"/>

  <!-- Water Surface Caustic Rays -->
  <g fill="#5eead4" opacity="0.18">
    <polygon points="500,0 100,1800 250,1800"/>
    <polygon points="500,0 400,1800 550,1800"/>
    <polygon points="500,0 750,1800 900,1800"/>
  </g>

  <!-- Coral Reef Bottom Silhouette -->
  <g fill="#01140f" opacity="0.9">
    <path d="M 0 1550 C 50 1450 80 1480 120 1520 C 150 1420 200 1460 220 1550 Z"/>
    <path d="M 750 1550 C 800 1420 850 1450 880 1500 C 920 1400 970 1460 1000 1550 Z"/>
    <path d="M 0 1620 Q 300 1580 600 1640 Q 800 1600 1000 1650 L 1000 1800 L 0 1800 Z"/>
  </g>

  <!-- Underwater Bubbles -->
  <g fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.6">
    <circle cx="200" cy="400" r="12"/><circle cx="220" cy="320" r="8"/>
    <circle cx="750" cy="650" r="16"/><circle cx="780" cy="580" r="10"/><circle cx="760" cy="500" r="6"/>
    <circle cx="450" cy="1100" r="14"/><circle cx="430" cy="1020" r="9"/>
    <circle cx="850" cy="1400" r="18"/><circle cx="820" cy="1300" r="12"/>
  </g>
</svg>